
<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="card" id="login" align="center">
      <!--login page-->
      <h1>Login</h1>
      <form>
        <label for="loginEmail">Email:</label>
        <input type="email" id="loginEmail" placeholder="email@gmail.com" required><br><br>

        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="password"required><br><br>

        <button type="submit">login</button>
      </form>
      <p>New User? <button type="button" onclick="showSignup()">Signup</button></p>
    </div>
    <!--Signup page-->
    <div class="bca" id="SignUp" style="display: none;" align="center">
      <h1>Create Account</h1>
      <form>
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" required><br><br>

        <label for="signEmail">Email</label>
        <input type="email" id="signEmail" placeholder="email@gmail.com" required><br><br>

        <label for="mobile">Mobile Number</label>
        <input type="number" placeholder="phone" id="mobile" required><br><br>

        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" required><br><br>

        <label for="conformpassword">Conform Password</label>
        <input type="password" id="conformpassword" required><br><br>
        <button type="submit">signup</button>
      </form>
      <p>Already have account? <button type="button" onclick="showLogin()">login</button></p>
    </div>
    <script>
      function showSignup() {
      document.getElementById("login").style.display = "none";
      document.getElementById("SignUp").style.display = "block";
     }

     function showLogin() {
     document.getElementById("SignUp").style.display = "none";
     document.getElementById("login").style.display = "block";
     }
    </script>
  </body>
</html>
