<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="cal.css">
    </head>
    <body>
        <h1>Calculator</h1>
        <div class="Calculator">
          <div class="cal" align="center">
             <div class="display">0</div>
            <button class="clear">AC</button>
            <button class="operator">%</button>
            <button class="operator">x</button>
            <button class="operator">+</button><br><br>
            <button class="number">9</button> <button class="number">8</button> <button class="number">7</button>
            <button class="operator">-</button><br><br>
            <button class="number">6</button> <button class="number">5</button> <button class="number">4</button>
            <button class="operator">*</button><br><br>
            <button class="number">3</button> <button class="number">2</button> <button class="number">1</button>
            <button class="operator">/</button><br><br>
            <button class="number">0</button> <button class="number">.</button> <button class="equal">=</button>
          </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
